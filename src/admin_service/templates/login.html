<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link id="site-favicon" rel="icon" type="image/png" href="/admin/ui/favicon.png">
  <title>Вход · DVD Admin</title>
  <link rel="stylesheet" href="/admin/ui/assets/admin.css?v=branding">
  <script src="/admin/ui/assets/admin.js?v=branding" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <img class="brand-logo" src="/admin/ui/logo.png" alt="Логотип DVD" width="64" height="64">
    <p class="eyebrow">IDU · DOCUMENT VECTOR DB</p>
    <h1>Панель управления</h1>
    <p class="muted">Войдите учётной записью IDU. Нужны права администратора.</p>
    <form id="login-form" method="post" action="/admin/ui/login" class="stack">
      <label>Логин<input name="username" type="text" required autofocus autocomplete="username"></label>
      <label>Пароль<input name="password" type="password" required autocomplete="current-password"></label>
      <button class="button primary" type="submit">Войти</button>
    </form>
    <p id="login-error" class="form-error" role="alert">{{ error }}</p>
    <p class="form-error">{{ configured }}</p>
  </main>
</body>
</html>
